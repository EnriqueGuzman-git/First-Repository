version: 2
updates:
  # Application dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch all dev-tooling bumps into one PR.
      dev-dependencies:
        dependency-type: "development"
      # Batch React and its types together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Batch Express and its types together.
      express:
        patterns:
          - "express"
          - "@types/express"

  # CI workflow action versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # Batch all GitHub Actions version bumps into one PR.
      github-actions:
        patterns:
          - "*"
